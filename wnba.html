<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WNBA - Sports Tracker</title>
    <link href="sport.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1 class="title">Sports Tracker</h1>
        <div class="header-right">
            <input type="text" id="search-bar" placeholder="Search...">
            <img src="images/notificationslogo.png" alt="Notifications" id="notification-icon">
            <div class="theme-toggle">
                <label class="switch">
                    <input type="checkbox" id="theme-toggle-checkbox">
                    <span class="slider"></span>
                </label>
                <span id="theme-label">Dark Mode</span>
            </div>
            <div class="home-link">
                <a href="index.html">Home</a>
            </div>
            <div>
                <a href="sports.html">Sports</a>
            </div>
        </div>
    </header>

    <section class="home-section">
        <h1 class="home-heading">WNBA</h1>
        <div class="paragraph-container">
            <p class="home-paragraph">
                Welcome to the WNBA section. Here you can track real-time statistics, player performance, and game outcomes for Women's Basketball.
            </p>
        </div>
    </section>

    <!-- Three-column layout container -->
    <div class="container">
        <!-- Scores Container (Left Column) -->
        <section class="section">
            <h2>WNBA Scores</h2>
            <div id="wnba-scores">
                <!-- Scores will be dynamically inserted here -->
            </div>
        </section>

        <!-- Teams Container (Middle Column) -->
        <section class="section">
            <h2>WNBA Teams</h2>
            <div id="wnba-teams">
                <!-- Teams will be dynamically inserted here -->
            </div>
        </section>

        <!-- News Container (Right Column) -->
        <section class="section">
            <h2>Latest WNBA News</h2>
            <div id="wnba-news">
                <!-- News articles will be dynamically inserted here -->
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2024 Sports Tracker. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
